name: Hourly Data Collection From APIs (HV, WET, Contrail)
on:
  schedule:
    - cron: "1 * * * *"  # Every hour at minute 1 (prevents hv api call issues)
  workflow_dispatch:  # Allows manual triggering for testing
jobs:
  data-pipeline:
    runs-on: ubuntu-latest
    steps:
      # === SETUP PHASE ===
      - name: Setup - Checkout code
        uses: actions/checkout@v4
      - name: Setup - Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Setup - Install Ubuntu system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev
      - name: Setup - Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          packages: |
            any::zoo
            any::padr
            any::janitor
            any::here
            any::Rcpp
            any::RcppRoll
            any::rvest
            any::httr
            any::httr2
            any::yaml
            any::tidyverse
            any::data.table
            any::arrow
            any::lubridate
            any::readxl
            any::magrittr
            any::xml2
            any::groupdata2
            any::slider
            github::ROSSyndicate/ross.wq.tools@uclp_dashboard_static
      # === DATA COLLATION PHASE ===
      - name: Collate Data
        working-directory: ./  # Ensure we're in the repo root
        env:
          CONTRAIL_CLIENT_ID: ${{ secrets.CONTRAIL_CLIENT_ID }}
          CONTRAIL_CLIENT_SECRET: ${{ secrets.CONTRAIL_CLIENT_SECRET }}
          CONTRAIL_CLIENT_URL: ${{ secrets.CONTRAIL_CLIENT_URL }}
          HYDROVU_CLIENT_ID: ${{ secrets.HYDROVU_CLIENT_ID }}
          HYDROVU_CLIENT_SECRET: ${{ secrets.HYDROVU_CLIENT_SECRET }}
          MWATER_SECRET: ${{secrets.MWATER_SECRET}}
        run: Rscript gha_scripts/data_collection_workflow.R
      # === SAVE PHASE ===
      - name: Save - Commit and push results
        run: |
          git config --global user.email 'actions@github.com'
          git config --global user.name 'GitHub Actions'

          # Sync branch without rebase to avoid binary replay conflicts
          git fetch origin ${{ github.ref_name }}
          git checkout ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}

          # Stage freshly generated artifact
          git add -f data/data_backup.parquet

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Hourly data update: $(date -u +%Y-%m-%d_%H:%M:%S_UTC)"
          git push origin ${{ github.ref_name }}
          echo "Data successfully updated and pushed"
